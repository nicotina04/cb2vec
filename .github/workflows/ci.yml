name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --all-targets --no-default-features

  quality:
    name: Formatting, lints, docs, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Keep lint results tied to the declared MSRV. Stable tests above still
      # catch compatibility with newer compilers without future Clippy churn.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - name: Verify the checked-in Unity plug-in metadata
        run: python3 tools/verify_unity_plugins.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run --locked --example flat_roundtrip
      - run: cargo run --locked --example reversible_journal
      - run: cargo run --locked --example train_value
      - run: cargo run --locked --example search_session
      - run: cargo run --locked --example resume_training
      - run: cargo package --locked

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --all-targets --no-default-features

  native:
    name: C ABI and C# P/Invoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: cargo build --locked --release --no-default-features
      - name: Verify exported C symbol allowlist
        run: |
          nm -D --defined-only target/release/libcb2vec.so \
            | awk '$3 ~ /^cb2vec_/ { print $3 }' \
            | sort > target/release/cb2vec.symbols
          diff -u include/cb2vec.symbols target/release/cb2vec.symbols
      - name: Verify every ABI 1.0 symbol still exists
        run: |
          # A dropped 1.0 symbol breaks consumers that never recompiled.
          missing=$(comm -23 include/cb2vec.symbols.abi10 target/release/cb2vec.symbols)
          if [ -n "$missing" ]; then
            echo "ABI 1.0 symbols missing from this build:"
            echo "$missing"
            exit 1
          fi
          echo "all $(wc -l < include/cb2vec.symbols.abi10) ABI 1.0 symbols present"
      - name: Compile and run C11 smoke
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iinclude examples/c_api_smoke.c \
            -Ltarget/release -lcb2vec \
            -Wl,-rpath,"$PWD/target/release" \
            -o target/release/c_api_smoke
          target/release/c_api_smoke
      - name: Compile header as C++17
        run: |
          c++ -x c++ -std=c++17 -Wall -Wextra -Werror \
            -Iinclude -c examples/c_api_smoke.c \
            -o target/release/c_api_smoke_cpp.o
      - run: dotnet build bindings/csharp/CB2VecNative.csproj --configuration Release --nologo
      - name: Run C# trainer/PTQ/reload smoke
        run: dotnet run --project bindings/csharp/smoke/CB2VecSmoke.csproj --configuration Release --nologo
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release

  android:
    name: Android cdylibs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Build Android shared libraries
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o target/android/jniLibs build --release --no-default-features
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_NDK_PLATFORM: "23"
      - run: test -s target/android/jniLibs/arm64-v8a/libcb2vec.so
      - run: test -s target/android/jniLibs/armeabi-v7a/libcb2vec.so
      - run: test -s target/android/jniLibs/x86_64/libcb2vec.so
      - name: Stage the Unity plug-in tree with the real Android binaries
        run: |
          cp target/android/jniLibs/arm64-v8a/libcb2vec.so \
            unity/Assets/Plugins/Android/arm64-v8a/
          cp target/android/jniLibs/armeabi-v7a/libcb2vec.so \
            unity/Assets/Plugins/Android/armeabi-v7a/
          cp target/android/jniLibs/x86_64/libcb2vec.so \
            unity/Assets/Plugins/Android/x86_64/
      - name: Verify Unity import settings, ABI architectures, and exports
        run: |
          # Catches the packaging failure this tree exists to prevent: an
          # arm64-v8a library labelled ARMv7, or an Android .so enabled for
          # every platform. Also proves all three ABIs export the full C ABI.
          python3 tools/verify_unity_plugins.py
      - name: Verify each Android ABI's architecture and symbol set
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "== $abi =="
            file "target/android/jniLibs/$abi/libcb2vec.so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cb2vec-unity-plugins
          path: |
            unity/
            include/cb2vec.h
            bindings/csharp/CB2VecNative.cs
