[package]
name = "cb2vec"
version = "0.2.0"
authors = ["nicotina04 <devherdson@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicotina04/cb2vec"
homepage = "https://github.com/nicotina04/cb2vec"
documentation = "https://docs.rs/cb2vec"
readme = "README.md"
description = "Train, quantize, and incrementally deploy categorical codebook value models in pure Rust"
keywords = ["embedding", "game-ai", "training", "quantization"]
categories = ["algorithms", "game-development"]
include = [
    "/src/**",
    "/examples/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-*",
]

[features]
default = ["json"]
json = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }

[package.metadata.docs.rs]
all-features = true

[workspace]
resolver = "3"
