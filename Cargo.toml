[package]
name = "cb2vec"
version = "0.3.1"
authors = ["nicotina04 <devherdson@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicotina04/cb2vec"
homepage = "https://github.com/nicotina04/cb2vec"
documentation = "https://docs.rs/cb2vec"
readme = "README.md"
description = "Train, checkpoint, quantize, and incrementally evaluate categorical codebook value models in pure Rust"
keywords = ["embedding", "game-ai", "training", "quantization", "search"]
categories = ["algorithms", "game-development"]
include = [
    "/src/**",
    "/examples/**",
    "/include/**",
    "/bindings/csharp/*.cs",
    "/bindings/csharp/*.csproj",
    "/bindings/csharp/smoke/*.cs",
    "/bindings/csharp/smoke/*.csproj",
    # Only the checked-in package sources. A plain "/unity/**" also sweeps up
    # the native libraries and the binding copy staged into the tree by a
    # build: `include` overrides .gitignore, so a publish from a working tree
    # that had been staged for Unity would ship megabytes of binaries.
    "/unity/README.md",
    "/unity/Assets/**/*.meta",
    "/unity/Assets/**/*.asmdef",
    "/unity/Assets/CB2Vec/Editor/*.cs",
    "/unity/Assets/CB2Vec/Tests/**/*.cs",
    "/tools/*.py",
    "/Cargo.toml",
    "/README.md",
    "/BENCHMARKS.md",
    "/CHANGELOG.md",
    "/LICENSE-*",
]

[lib]
name = "cb2vec"
crate-type = ["rlib", "cdylib"]

[features]
default = ["json"]
json = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }

[package.metadata.docs.rs]
all-features = true

[profile.release]
panic = "unwind"

[workspace]
resolver = "3"
